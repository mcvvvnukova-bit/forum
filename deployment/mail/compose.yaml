name: astforum-mail

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16.21
    restart: unless-stopped
    environment:
      STALWART_PUBLIC_URL: https://mail.astforum.ru
      TZ: Europe/Moscow
    volumes:
      - ./stalwart/config:/etc/stalwart
      - ./stalwart/data:/var/lib/stalwart
    ports:
      - "127.0.0.1:18080:8080"
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
    networks:
      mail:
        aliases:
          - mail.astforum.ru
      proxy:
        aliases:
          - astforum-stalwart
    logging: *logging

  tmail:
    image: linagora/tmail-web:v0.36.0
    restart: unless-stopped
    volumes:
      - ./tmail/env.file:/usr/share/nginx/html/assets/env.file:ro
    ports:
      - "127.0.0.1:18081:80"
    networks:
      proxy:
        aliases:
          - astforum-tmail
    logging: *logging

  database:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: listmonk
      POSTGRES_DB: listmonk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listmonk -d listmonk"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging: *logging

  listmonk:
    image: listmonk/listmonk:v6.2.0
    restart: unless-stopped
    command: ["./listmonk", "--config", ""]
    environment:
      LISTMONK_app__address: 0.0.0.0:9000
      LISTMONK_db__host: database
      LISTMONK_db__port: 5432
      LISTMONK_db__user: listmonk
      LISTMONK_db__password: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      LISTMONK_db__database: listmonk
      LISTMONK_db__ssl_mode: disable
      TZ: Europe/Moscow
    volumes:
      - ./uploads:/listmonk/uploads
    ports:
      - "127.0.0.1:19000:9000"
    networks:
      - backend
      - mail
      - proxy
    depends_on:
      database:
        condition: service_healthy
    logging: *logging

networks:
  backend:
    internal: true
  mail:
  proxy:
    external: true
    name: outline_frontend
