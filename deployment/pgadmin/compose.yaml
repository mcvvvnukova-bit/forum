name: pgadmin

services:
  pgadmin:
    image: dpage/pgadmin4:9.17
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@astforum.ru
      PGADMIN_DEFAULT_PASSWORD_FILE: /run/secrets/pgadmin_admin_password
      PGADMIN_DISABLE_POSTFIX: "1"
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"
      PGADMIN_LISTEN_ADDRESS: "0.0.0.0"
      PGADMIN_LISTEN_PORT: "5050"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
      PGPASS_FILE: /run/secrets/outline_pgpass
      PGPASSFILE: /run/secrets/outline_pgpass
    ports:
      - "127.0.0.1:5050:5050"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
      - ./servers.json:/pgadmin4/servers.json:ro
    secrets:
      - pgadmin_admin_password
      - outline_pgpass
    networks:
      - outline-backend
      - pgadmin-access
      - outline-frontend
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  pgadmin-data:
    name: pgadmin-data

networks:
  outline-backend:
    external: true
    name: outline_backend
  outline-frontend:
    external: true
    name: outline_frontend
  pgadmin-access:
    driver: bridge

secrets:
  pgadmin_admin_password:
    file: ./secrets/admin_password
  outline_pgpass:
    file: ./secrets/outline_pgpass
