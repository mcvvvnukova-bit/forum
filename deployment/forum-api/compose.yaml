services:
  forum_api:
    image: ${FORUM_API_IMAGE:-astforum/forum-api:latest}
    build: ../../apps/api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
    expose:
      - "3001"
    volumes:
      - ./secrets:/run/secrets:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - frontend
      - database
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  frontend:
    external: true
    name: ${FORUM_FRONTEND_NETWORK:-outline_frontend}
  database:
    external: true
    name: ${FORUM_DATABASE_NETWORK:-outline_backend}
