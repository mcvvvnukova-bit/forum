services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_PASSWORD: local-auth-tests
      POSTGRES_DB: forum_auth_test
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forum_auth_test"]
      interval: 2s
      timeout: 2s
      retries: 30
