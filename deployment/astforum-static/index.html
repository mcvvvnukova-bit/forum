<!doctype html>
<html lang="ru" data-color-mode="light" data-light-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Мы готовимся к запуску. Пожалуйста, возвращайтесь в декабре 2026г.">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="ru_RU">
  <meta property="og:title" content="Сайт находится в разработке">
  <meta property="og:description" content="Мы готовимся к запуску. Пожалуйста, возвращайтесь в декабре 2026г.">
  <meta property="og:image" content="https://astforum.ru/forum-hard-hat.png">
  <title>АСТ ФОРУМ — сайт в разработке</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <style>
    @font-face {
      font-family: "Golos Text";
      src: url("/fonts/golos-text-cyrillic.woff2") format("woff2");
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }

    @font-face {
      font-family: "Golos Text";
      src: url("/fonts/golos-text-latin.woff2") format("woff2");
      font-style: normal;
      font-weight: 400 600;
      font-display: swap;
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    @font-face {
      font-family: "Unbounded";
      src: url("/fonts/unbounded-cyrillic.woff2") format("woff2");
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
    }

    @font-face {
      font-family: "Unbounded";
      src: url("/fonts/unbounded-latin.woff2") format("woff2");
      font-style: normal;
      font-weight: 600;
      font-display: swap;
      unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;
    }

    :root {
      color-scheme: light;
      --fontStack-sansSerif: "Golos Text", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --fontStack-sansSerifDisplay: "Unbounded", "Golos Text", system-ui, sans-serif;
      --bgColor-default: #ffffff;
      --bgColor-muted: #f6f8fa;
      --fgColor-default: #282828;
      --fgColor-muted: #4a4a4a;
      --borderColor-default: #d6d6d6;
      --borderRadius-large: 12px;
      --base-size-16: 16px;
      --base-size-20: 20px;
      --base-size-24: 24px;
      --base-size-28: 28px;
      --base-size-32: 32px;
      --base-size-40: 40px;
      --base-size-44: 44px;
      --base-size-48: 48px;
      --base-size-56: 56px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: var(--base-size-32);
      background: var(--bgColor-muted);
      color: var(--fgColor-default);
      font-family: var(--fontStack-sansSerif);
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    .placeholder-card {
      width: min(820px, 100%);
      min-height: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: var(--base-size-48) var(--base-size-56) var(--base-size-56);
      border: 1px solid var(--borderColor-default);
      border-radius: var(--borderRadius-large);
      background: var(--bgColor-default);
      text-align: center;
    }

    .maintenance-illustration {
      display: block;
      width: min(300px, 88%);
      height: auto;
      margin: 0 0 var(--base-size-28);
    }

    h1 {
      max-width: 650px;
      margin: 0;
      color: var(--fgColor-default);
      font-family: var(--fontStack-sansSerifDisplay);
      font-size: clamp(24px, 3vw, 28px);
      font-weight: 600;
      line-height: 1.3;
      letter-spacing: -0.02em;
    }

    p {
      max-width: 720px;
      margin: var(--base-size-20) 0 0;
      color: var(--fgColor-muted);
      font-size: 16px;
      font-weight: 400;
      line-height: 1.5;
      white-space: nowrap;
    }

    @media (max-width: 640px) {
      body {
        padding: var(--base-size-16);
      }

      .placeholder-card {
        min-height: min(620px, calc(100vh - 32px));
        padding: var(--base-size-40) var(--base-size-24) var(--base-size-44);
      }

      .maintenance-illustration {
        width: min(270px, 94%);
        margin-bottom: var(--base-size-24);
      }

      p {
        margin-top: var(--base-size-20);
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <main class="placeholder-card" aria-labelledby="page-title">
    <img
      class="maintenance-illustration"
      src="/forum-hard-hat.png"
      alt="Строительная каска с логотипом ФОРУМ"
      width="1536"
      height="1024"
      fetchpriority="high"
      decoding="async"
    >
    <h1 id="page-title">Сайт находится в разработке</h1>
    <p>Мы готовимся к запуску. Пожалуйста, возвращайтесь в декабре 2026г.</p>
  </main>
</body>
</html>
