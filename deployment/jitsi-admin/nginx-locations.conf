# Include inside the existing TLS server for vks.mvpspace.ru.
access_log /var/log/nginx/vks-access.log vks_redacted;

location = /admin { return 302 /admin/; }
location = /admin/ { return 302 /admin/room/dashboard; }

# The pinned upstream bundle hard-codes /build/ in its manifest and lazy chunks.
# Jitsi Meet uses /libs and /css; expose only this static asset namespace.
location ^~ /build/ {
    limit_except GET { deny all; }
    proxy_pass http://127.0.0.1:18090/build/;
    proxy_set_header Host $host;
    access_log off;
}

location ^~ /admin/auth/ {
    proxy_pass http://127.0.0.1:18080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    access_log off;
}

location ^~ /ws/ {
    proxy_pass http://127.0.0.1:18091/ws/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection upgrade;
    proxy_read_timeout 600s;
    access_log off;
}

location ^~ /admin/ {
    proxy_pass http://127.0.0.1:18090/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Port 443;
    proxy_set_header X-Forwarded-Prefix /admin;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_redirect off;
    client_max_body_size 20m;
    access_log off;
}
