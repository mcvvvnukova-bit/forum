name: Candidate quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORUM_TEST_POSTGRES_IMAGE: postgres@sha256:d3e1620b530c944afa6e887d22eb899824da68e19c52024bf98f5220c88a65b2

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      selection: ${{ steps.select.outputs.selection }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          package-manager-cache: false
      - name: Select checks from candidate changes
        id: select
        run: node scripts/verification/ci-selection.mjs

  layout:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Candidate repository layout
        run: node scripts/verification/check-repository-layout.mjs
      - name: Verification and CI regressions
        run: |
          node --test scripts/verification/checks.test.mjs scripts/verification/ci-optimization.test.mjs
          python3 -m unittest discover -s scripts/verification -p test_local_ci.py -v
      - name: Install mail-check Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Mail resource regressions
        run: npm run test:mail
      # Only a status receipt is uploaded. Raw application logs, environment,
      # generated sites and private worktree contents stay out of artifacts.
      - name: Sanitized failure receipt
        if: failure()
        env:
          QUALITY_JOB: layout
        run: |
          mkdir -p .quality
          python3 -c 'import json,os,pathlib; pathlib.Path(".quality/failure.json").write_text(json.dumps({"job":os.environ["QUALITY_JOB"],"status":"failure","diagnostics":"See failed command in Actions log"}))'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: failure-layout
          path: .quality/failure.json
          if-no-files-found: error
          retention-days: 7

  api:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.selection).api }}
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.ASTFORUM_CI_DOCKER_RUNNERS || '["ubuntu-24.04"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
      - name: Clean install of API and its landing composition
        run: |
          npm ci
      - name: Install API-owned Chromium
        working-directory: apps/api
        run: npx --no-install playwright install --with-deps chromium
      - name: API, diagnostics and browser acceptance on disposable PostgreSQL
        run: bash scripts/verification/check-api.sh
      # Only a status receipt is uploaded. Raw application logs, environment,
      # generated sites and private worktree contents stay out of artifacts.
      - name: Sanitized failure receipt
        if: failure()
        env:
          QUALITY_JOB: api
        run: |
          mkdir -p .quality
          python3 -c 'import json,os,pathlib; pathlib.Path(".quality/failure.json").write_text(json.dumps({"job":os.environ["QUALITY_JOB"],"status":"failure","diagnostics":"See failed command in Actions log"}))'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: failure-api
          path: .quality/failure.json
          if-no-files-found: error
          retention-days: 7

  frontend:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.selection).frontend }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [legacy-landing, web]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Install landing-owned Chromium for its layout test
        if: matrix.package == 'legacy-landing'
        working-directory: apps/legacy-landing
        run: npx --no-install playwright install --with-deps chromium
      - name: Tracked Primer policy and negative regressions
        if: matrix.package == 'web'
        run: |
          npm run test:primer
          npm run check:primer
      - name: Declared frontend checks
        working-directory: apps/${{ matrix.package }}
        env:
          FRONTEND_PACKAGE: ${{ matrix.package }}
        run: |
          npm run typecheck
          if [ "$FRONTEND_PACKAGE" != legacy-landing ]; then npm run lint; fi
          npm test
          # dev-landing's declared test:layout already builds both entrypoints.
          if [ "$FRONTEND_PACKAGE" != legacy-landing ]; then npm run build; fi
      # Only a status receipt is uploaded. Raw application logs, environment,
      # generated sites and private worktree contents stay out of artifacts.
      - name: Sanitized failure receipt
        if: failure()
        env:
          QUALITY_JOB: frontend-${{ matrix.package }}
        run: |
          mkdir -p .quality
          python3 -c 'import json,os,pathlib; pathlib.Path(".quality/failure.json").write_text(json.dumps({"job":os.environ["QUALITY_JOB"],"status":"failure","diagnostics":"See failed command in Actions log"}))'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: failure-frontend-${{ matrix.package }}
          path: .quality/failure.json
          if-no-files-found: error
          retention-days: 7

  composition:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.selection).composition }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
      - name: Clean install all composition owners
        run: |
          npm ci
      - name: Actual public-site component composition
        run: npm run test:composition
      # Only a status receipt is uploaded. Raw application logs, environment,
      # generated sites and private worktree contents stay out of artifacts.
      - name: Sanitized failure receipt
        if: failure()
        env:
          QUALITY_JOB: composition
        run: |
          mkdir -p .quality
          python3 -c 'import json,os,pathlib; pathlib.Path(".quality/failure.json").write_text(json.dumps({"job":os.environ["QUALITY_JOB"],"status":"failure","diagnostics":"See failed command in Actions log"}))'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: failure-composition
          path: .quality/failure.json
          if-no-files-found: error
          retention-days: 7

  publishers:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.selection).publishers }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
      - name: Actual three-publisher regression suites
        run: |
          python3 -m unittest discover -s tests/integration -p 'test_public_site_release.py' -v
          python3 -m unittest discover -s scripts/deployment/primer-home -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/deployment/audience-pages -p 'test_*.py' -v
          python3 -m unittest discover -s scripts/deployment/public-auth -p 'test_*.py' -v
      # Only a status receipt is uploaded. Raw application logs, environment,
      # generated sites and private worktree contents stay out of artifacts.
      - name: Sanitized failure receipt
        if: failure()
        env:
          QUALITY_JOB: publishers
        run: |
          mkdir -p .quality
          python3 -c 'import json,os,pathlib; pathlib.Path(".quality/failure.json").write_text(json.dumps({"job":os.environ["QUALITY_JOB"],"status":"failure","diagnostics":"See failed command in Actions log"}))'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: failure-publishers
          path: .quality/failure.json
          if-no-files-found: error
          retention-days: 7

  database:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.selection).database }}
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.ASTFORUM_CI_DOCKER_RUNNERS || '["ubuntu-24.04"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
      - name: Network-isolated disposable PostgreSQL ACL regressions
        run: |
          if [ "$(docker image inspect --platform linux/amd64 --format '{{.Os}}/{{.Architecture}}' "$FORUM_TEST_POSTGRES_IMAGE" 2>/dev/null || true)" != linux/amd64 ]; then
            docker pull --platform linux/amd64 "$FORUM_TEST_POSTGRES_IMAGE"
          fi
          python3 -m unittest discover -s deployment/forum-db/tests -p 'test_*.py' -v
      # Only a status receipt is uploaded. Raw application logs, environment,
      # generated sites and private worktree contents stay out of artifacts.
      - name: Sanitized failure receipt
        if: failure()
        env:
          QUALITY_JOB: database
        run: |
          mkdir -p .quality
          python3 -c 'import json,os,pathlib; pathlib.Path(".quality/failure.json").write_text(json.dumps({"job":os.environ["QUALITY_JOB"],"status":"failure","diagnostics":"See failed command in Actions log"}))'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: failure-database
          path: .quality/failure.json
          if-no-files-found: error
          retention-days: 7

  profile:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.selection).profile }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
          cache: npm
      - name: Profile fixture checks from the workspace lock
        run: |
          npm ci
          npm run typecheck --workspace @astforum/profile-preview
          npm run lint --workspace @astforum/profile-preview
          npm test --workspace @astforum/profile-preview
          npm run build --workspace @astforum/profile-preview

  operational:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.selection).operational }}
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.ASTFORUM_CI_DOCKER_RUNNERS || '["ubuntu-24.04"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Sanitized operational syntax and source contracts
        run: python3 scripts/verification/check-operational-sources.py

  web-release:
    needs: changes
    if: ${{ fromJSON(needs.changes.outputs.selection)['web-release'] }}
    runs-on: ${{ fromJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && vars.ASTFORUM_CI_DOCKER_RUNNERS || '["ubuntu-24.04"]') }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24.18.1
          cache: npm
      - run: npm ci
      - name: Build environment isolation and actual Vite media serving
        run: node --test scripts/verification/web-build-inputs.test.mjs
      - name: Build exact immutable dev and separately owned production
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          node scripts/deployment/build-web-release.mjs dev "$RUNNER_TEMP/forum-web-dev" "$SOURCE_SHA"
          node scripts/deployment/build-web-release.mjs production "$RUNNER_TEMP/forum-web-production" "$SOURCE_SHA"
      - name: Actual Docker serving, retained assets, atomic switch and rollback
        run: bash scripts/verification/check-web-release.sh "$RUNNER_TEMP/forum-web-dev"
      - name: Built route, held-session, history, focus and viewport regressions
        env:
          FORUM_WEB_SITE: ${{ runner.temp }}/forum-web-dev/site
        run: |
          npx --no-install playwright install --with-deps chromium
          npx --no-install playwright test --config tests/e2e/public-site.config.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: forum-web-dev-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/forum-web-dev/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: forum-web-production-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/forum-web-production/
          if-no-files-found: error
          retention-days: 30

  quality:
    name: quality
    if: always()
    needs: [changes, layout, api, frontend, composition, publishers, database, profile, operational, web-release]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.1
      - name: Require every prerequisite to succeed
        env:
          QUALITY_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/verification/quality-gate.mjs
